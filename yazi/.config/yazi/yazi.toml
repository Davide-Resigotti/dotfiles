[manager]
sort_by = "btime"
sort_reverse = true
sort_dir_first = false
ratio = [ 1, 3, 4 ]

[opener]
edit = [
	{ run = 'nvim "$@"', block = true },
]
open_default = [
	{ run = 'xdg-open "$@"', desc = "Open" }
]

[open]
rules = [
	{ name = "*.md", use = [ "edit" ] },
	{ mime = "text/*", use = [ "edit" ] },
	{ mime = "application/pdf", use = [ "open_default" ] },
  { name = "*", use = [ "edit" ] },
]
